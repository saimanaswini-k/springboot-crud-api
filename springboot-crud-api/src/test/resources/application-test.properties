# PostgreSQL Database configuration for testing
spring.datasource.url=jdbc:postgresql://localhost:5432/obsrv_test
spring.datasource.username=obsrv_user
spring.datasource.password=obsrv123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop

# Add proper handling of PostgreSQL arrays
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.auto-commit=false

# Configure array type handling
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Show SQL queries in the console (optional)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable detailed error messages for development
server.error.include-message=always
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false 